<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .students-list {
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .form-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
        .success {
            color: green;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <div class="search-container">                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
            <h2>Search Student by ID</h2>
            <div class="form-group">
                <label for="searchId">Student ID:</label>
                <input type="text" id="searchId" name="searchId">
                <button onclick="getStudentById()">Search</button>
            </div>
            <div id="searchResult"></div>
        </div>
        
        <div class="students-list">
            <h2>Students List</h2>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Students will be loaded here -->
                </tbody>
            </table>
        </div>
        
        <div class="form-container">
            <h2>Add New Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="grade">Grade:</label>
                    <input type="text" id="grade" name="grade" required>
                </div>
                <button type="submit">Add Student</button>
            </form>
            <div id="message" class="success"></div>
        </div>
    </div>

    <script>
        // Function to fetch and display students
        async function fetchStudents() {
            try {
                const response = await fetch('http://localhost:3000/students');
                if (!response.ok) {
                    throw new Error('Failed to fetch students');
                }
                const students = await response.json();
                
                const tbody = document.querySelector('#studentsTable tbody');
                tbody.innerHTML = '';
                
                students.forEach(student => {
                    const row = document.createElement('tr');
                    
                    const idCell = document.createElement('td');
                    idCell.textContent = student.id;
                    row.appendChild(idCell);
                    
                    const nameCell = document.createElement('td');
                    nameCell.textContent = student.name;
                    row.appendChild(nameCell);
                    
                    const gradeCell = document.createElement('td');
                    gradeCell.textContent = student.grade;
                    row.appendChild(gradeCell);
                    
                    const dateCell = document.createElement('td');
                    const date = new Date(student.created_at);
                    dateCell.textContent = date.toLocaleString();
                    row.appendChild(dateCell);
                    
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('message').textContent = 'Error loading students';
                document.getElementById('message').className = 'error';
            }
        }

        // Function to get student by ID
        async function getStudentById() {
            const studentId = document.getElementById('searchId').value;
            const searchResult = document.getElementById('searchResult');
            
            if (!studentId) {
                searchResult.textContent = 'Please enter a student ID';
                searchResult.className = 'error';
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/students/${studentId}`);
                
                if (!response.ok) {
                    throw new Error('Student not found');
                }
                
                const student = await response.json();
                
                searchResult.innerHTML = `
                    <h3>Student Details</h3>
                    <table>
                        <tr>
                            <th>ID</th>
                            <td>${student.id}</td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td>${student.name}</td>
                        </tr>
                        <tr>
                            <th>Grade</th>
                            <td>${student.grade}</td>
                        </tr>
                        <tr>
                            <th>Created At</th>
                            <td>${new Date(student.created_at).toLocaleString()}</td>
                        </tr>
                    </table>
                `;
                searchResult.className = 'success';
                
            } catch (error) {
                console.error('Error:', error);
                searchResult.textContent = error.message;
                searchResult.className = 'error';
            }
        }

        // Function to handle form submission
        async function handleSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const grade = document.getElementById('grade').value;
            const messageEl = document.getElementById('message');
            
            try {
                const response = await fetch('http://localhost:3000/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, grade }),
                });
                
                if (!response.ok) {
                    throw new Error('Failed to add student');
                }
                
                // Clear form and show success message
                document.getElementById('studentForm').reset();
                messageEl.textContent = 'Student added successfully!';
                messageEl.className = 'success';
                
                // Refresh the students list
                fetchStudents();
                
                // Clear message after 3 seconds
                setTimeout(() => {
                    messageEl.textContent = '';
                }, 3000);
            } catch (error) {
                console.error('Error:', error);
                messageEl.textContent = 'Error adding student';
                messageEl.className = 'error';
            }
        }

        // Event listeners
        document.getElementById('studentForm').addEventListener('submit', handleSubmit);
        
        // Load students when page loads
        document.addEventListener('DOMContentLoaded', fetchStudents);
    </script>
</body>
</html>
